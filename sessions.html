<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EvNt Organizer - Session Management</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-dark bg-black mb-4">
            <div class="container">
                <a class="navbar-brand" href="index.html">EvNt Organizer</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="signup.html">Register / Sign Up</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white fw-bold" href="sessions.html">Manage Sessions</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">

                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0" id="formHeader">Add Conference Session</h4>
                        </div>
                        <div class="card-body">
                            <div id="sessionErrorAlert" class="alert alert-danger d-none" role="alert"></div>
                            
                            <form id="sessionForm" novalidate>
                                <input type="hidden" id="editSessionIndex" value="-1">
                                
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="sessionId" class="form-label">Session ID <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="sessionId" placeholder="e.g. EVNT-100">
                                    </div>
                                    <div class="col-md-8 mb-3">
                                        <label for="sessionTitle" class="form-label">Session Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="sessionTitle" placeholder="e.g. Building Enterprise Web Apps">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="sessionCategory" class="form-label">Category / Track <span class="text-danger">*</span></label>
                                        <select class="form-select" id="sessionCategory">
                                            <option value="">Select a Track...</option>
                                            <option value="Keynote">Keynote</option>
                                            <option value="Workshop">Workshop</option>
                                            <option value="Panel">Panel</option>
                                            <option value="Technical Breakout">Technical Breakout</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="sessionFormat" class="form-label">Session Format <span class="text-danger">*</span></label>
                                        <select class="form-select" id="sessionFormat">
                                            <option value="">Select Format...</option>
                                            <option value="In-Person">In-Person</option>
                                            <option value="Virtual">Virtual</option>
                                            <option value="Hybrid">Hybrid</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="sessionPrice" class="form-label">Registration Fee ($) <span class="text-danger">*</span></label>
                                        <input type="number" step="0.01" min="0" class="form-control" id="sessionPrice" placeholder="0.00">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="sessionAdditional" class="form-label">Room / Speaker Details <span class="text-muted">(Optional)</span></label>
                                    <input type="text" class="form-control" id="sessionAdditional" placeholder="e.g. Room 204 - John Smith">
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" id="saveSessionBtn" class="btn btn-primary">Add Session</button>
                                    <button type="button" id="cancelSessionEditBtn" class="btn btn-secondary d-none">Cancel Edit</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Current Conference Sessions</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-2 mb-3">
                                <div class="col-md-8">
                                    <input type="text" id="searchInput" class="form-control" placeholder="Search sessions by title or category (jQuery)...">
                                </div>
                                <div class="col-md-4">
                                    <select id="filterCategory" class="form-select">
                                        <option value="ALL">All Categories</option>
                                        <option value="Keynote">Keynote</option>
                                        <option value="Workshop">Workshop</option>
                                        <option value="Panel">Panel</option>
                                        <option value="Technical Breakout">Technical Breakout</option>
                                    </select>
                                </div>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0 align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Title</th>
                                            <th>Category</th>
                                            <th>Format</th>
                                            <th>Fee</th>
                                            <th>Details</th>
                                            <th class="text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="sessionsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">
                            <h6 class="mb-0">Data Preview (JSON Format)</h6>
                        </div>
                        <div class="card-body p-2 bg-dark">
                            <pre id="sessionsJsonOutput" class="text-light m-0 font-monospace small">[]</pre>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <footer class="bg-black text-white py-4 mt-auto">
            <div class="container text-center">
                <p class="mb-0">&copy; 2026 Evnt Organizer. All rights reserved.</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="sessions.js"></script>
    </body>


</html>
