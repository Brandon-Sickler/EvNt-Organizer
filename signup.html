<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EvNt Organizer - Attendee Registration</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="bg-light">

        <!-- Navigation Bar-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-black mb-4">
            <div class="container">
                <a class="navbar-brand" href="index.html">EvNt Organizer</a>
                <div class="navbar-nav ms-auto gap-3">
                    <a class="nav-link text-white" href="index.html">Home</a>
                    <a class="nav-link active fw-bold text-white" href="signup.html">Register / Sign Up</a>
                    <a class="nav-link text-white" href="sessions.html">Manage Sessions</a>
                </div>
            </div>
        </nav>
    
        <main class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <!--Registration card-->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">Conference Attendee Registration</h4>
                        </div>
                        <div class="card-body">
                            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
                            <form id="signup-form" novalidate>
                                <input type="hidden" id="editIndex" value="-1">

                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe">
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                                </div>

                                <div class="row">
                                    <div class="col-md-6 md-3">
                                        <label for="age" class="form-label">Age <span class="text-danger"></span></label>
                                        <input type="number" class="form-control" id="age" min="1" max="120" placeholder="e.g. 28">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Contact Phone Number <span class="text-muted">(Optional)</span></label>
                                        <input type="tel" class="form-control" id="phone" placeholder="e.g. 555-555-5555">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="affiliation" class="form-label">Affiliation / Organization <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="affiliation" placeholder="e.g. Penn State University">
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" id="submitBtn" class="btn btn-primary">Register Attendee</button>
                                    <button type="button" id="cancelEditBtn" class="btn btn-secondary d-none">Cancel Edit</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Registered Attendees</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Age</th>
                                            <th>Affiliation</th>
                                            <th>Phone</th>
                                            <th class="text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="membersTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">
                            <h6 class="mb-0">Data Preview (JSON Format)</h6>
                        </div>
                        <div class="card-body p-2 bg-dark">
                            <pre id="jsonOutput" class="text-light m-0 font-monospace small">[]</pre>
                        </div>
                    </div>


                </div>
            </div>
        </main>
    
        <footer class="text-center py-3 text-muted border-top bg-white">
            <p class="mb-0">&copy; 2026 EvNt Organizer Platform. All rights reserved.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
